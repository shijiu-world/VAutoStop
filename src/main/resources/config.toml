# ═══════════════════════════════════════════════════════════════════════════
#  VAutoStop · 子服空服自动关机
#  装在 Velocity 代理端，子服不用装任何东西。
#  逻辑一句话：每隔 interval-minutes 分钟看一眼各子服人数，连续 required-empty-checks
#  次都是 0 人 → 调 MCSManager 面板把对应实例停掉。
#
#  改完执行 /vautostop reload（不需要重启代理）
#
#  上线前必填 3 处
#    1. [mcsm]        url / daemon-id / apikey   —— 面板在哪、怎么认证
#    2. [servers.*]   uuid 列表                  —— 每个子服对应面板上哪些实例
#    3. [filter]      抄一眼是不是你想要的那些子服
#
#  改完用这两条命令核对
#    /vautostop test    逐个子服查一次面板实例状态（能查到 = 地址/uuid/密钥都没问题）
#    /vautostop list    看插件到底在盯哪些子服、每个服现在有几个人
#
#  语法：字符串用 "..." 或 '...'，# 后面是注释，数组用 [ ... ]
#  变量：${env:XXX} = 系统环境变量（放密钥用），${env:XXX:-兜底值} 没设置时用兜底值
#        环境变量要在开服脚本里 export 再启动代理，改完要重启（reload 不重读环境）
# ═══════════════════════════════════════════════════════════════════════════

# ───────────────────────────────── 总闸 ─────────────────────────────────────

enabled = true      # false = 整个巡检停摆（一条 estop 请求都不发），改完 /vautostop reload

# ─────────────────────────────── 巡检节奏 ───────────────────────────────────

interval-minutes = 10        # 每隔多少分钟查一次人数（1 ~ 1440）
required-empty-checks = 2    # 连续几次查到 0 人才动手（最少 2 次，写 1 也会被当成 2）
                             #   一次采样说明不了"真没人" —— 玩家可能刚好在换服，那一瞬间
                             #   原服和目的服都是 0 人。所以策略改为：同一个子服连续两次
                             #   都被读到没人，才发停机命令。
                             #   折算成时间：2 × interval-minutes = 空了 10~20 分钟才关（本例间隔 10 分钟）
                             #   想更保守就写到 3、4 次；间隔调小，同样次数等的总时间自然也短

# ─────────────────────────────── 盯哪些服 ───────────────────────────────────
#  mode = "blacklist"  黑名单：除 servers 里列出的，其余已注册的子服都盯着（默认）
#                      ⚠ servers 留空 = 一个不排除 = 盯所有子服（把 lobby 排除掉！）
#  mode = "whitelist"  白名单：只盯 servers 里列出的
#                      servers 留空 = 谁都不盯（安全起见，这是白名单的空态）
#  名字写 velocity.toml [servers] 里的那个（大小写不敏感），下面 [servers.xxx] 的 xxx 要一致
# ────────────────────────────────────────────────────────────────────────────

[filter]
mode = "blacklist"
servers = ["lobby", "survival", "velocity"]   # 大厅和主生存别自动关，其余都关

# ──────────────────────────── MCSManager 面板 ───────────────────────────────
#  对接的接口（当前版本面板，路径与认证方式写死在插件里，不提供配置）
#    停实例  GET /api/protected_instance/stop?uuid=<实例>&daemonId=<守护>&apikey=<密钥>
#    查状态  GET /api/instance?uuid=<实例>&daemonId=<守护>&apikey=<密钥>
#    必需头  X-Requested-With: XMLHttpRequest
#            Content-Type: application/json; charset=utf-8
#            （这两个头是面板文档点名要求的，不带会被判非法请求 → 403）
#    状态码  -1 忙碌 / 0 停止 / 1 停止中 / 2 启动中 / 3 运行中
#  ⚠ apikey 会拼在 URL 上，所以日志和命令输出里的地址都会自动打码成 ***
# ────────────────────────────────────────────────────────────────────────────

[mcsm]
enabled = true          # false = 只在日志里说说「该关了」，绝不联网（调试用）

url = "http://127.0.0.1:24444"             # 面板地址，结尾别带斜杠（换成你自己的）
daemon-id = "这里填守护进程 uuid"           # 守护进程 uuid ⚠ 上线前用 /vautostop test 核对
apikey = "${env:MCSM_KEY}"                # 🔐 api-key，走环境变量；取不到会后台告警并当作空

timeout-ms = 8000       # 单次请求超时（毫秒），面板卡住时不至于一直挂着
verify-running = true   # 停之前先查一次面板状态：只有「运行中(3)」才发停止指令
                        #   好处：这个子服要是不在跑（比如正在启动、已经停了），不会被反复停
                        #   代价：每个候选实例多一次 HTTP（一回合多零点几秒，无所谓）
                        #   🔴 某个子服配了 2 个以上 uuid 时，这条强制按 true 处理 ——
                        #      同端口互斥的那一组，不查就不知道该停哪个
dry-run = false         # true = 走完所有判断、日志里写「本会关闭 X」，但真的不发停止请求
                        #   第一次上线强烈建议先开 true 观察一轮日志

# ─────────────────────────────── 保险措施 ───────────────────────────────────
#  这个插件是「关服」性质的，多一道保险不亏：任何一条不满足，就跳过这一轮。
# ────────────────────────────────────────────────────────────────────────────

[safety]
startup-grace-minutes = 3     # 代理启动/reload 后的前几分钟只记录不动手
                              #   刚开服时后端还在启动、玩家还没进来，不看 pity 一段时间
retry-cooldown-minutes = 5    # 同一个子服尝试过一次停机后，至少隔这么久才再试
                              #   防止面板抽风时每个巡检周期都去怼一次

# ─────────────────────────────── 子服 → 实例 ─────────────────────────────────
#  一节一个子服，[servers.<子服名>] 里的 <子服名> 要跟 velocity.toml 里的完全一致
#
#    uuid       面板实例 uuid 的**列表**（必填）—— 面板 → 打开实例 → 地址栏那串 32 位十六进制
#
#               🔴 为什么是列表：有些子服是「一个端口挂好几个面板实例」的用法
#                  （典型如 killer 换游戏 = 停掉当前实例、启动另一个），它们共用同一个端口，
#                  但同时至多只会有一个在跑。插件不猜是哪个，而是每次要关机时
#                  把列表里的 uuid 逐个查一遍状态，只对明确处于「运行中(3)」的那个发停止指令。
#                  常年忘了清理的可怜实例（面板上早删了）会被自动跳过 —— 查不出来的不碰。
#
#               写法：uuid = ["一串", "另一串"]（推荐）
#                     单个也可以偷懒写 uuid = "一串"，等价于一元素列表
#
#    daemon-id  可选，该实例不在上面默认守护上时才写
#    enabled    可选，false = 这个服永远不自动关（留着配置但先停用）
#
#  ⚠ 一份 uuid 都不合法/没填 → 这个服盯到了也不会关，后台会提醒一次
#  ⚠ 列表里如果有面板上已删除的实例，第一次查到时后台会提醒一次「建议删掉」，之后不再刷屏
# ────────────────────────────────────────────────────────────────────────────

[servers.killer]
uuid = ["实例uuid（跑着的那个）", "实例uuid（另一个）"]   # 同端口互斥，逐个查谁在跑

[servers.bedwars]
uuid = ["实例uuid"]
enabled = false     # 先留着不启用

[servers.minigame]
uuid = ["实例uuid"]

[servers.starvalley]
uuid = ["实例uuid"]
